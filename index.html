<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Gym</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div id="topbar">
  <div class="row">
    <h1 id="topTitle">MI GYM</h1>
    <span class="badge" id="topDay"></span>
  </div>
  <div class="sub" id="topSub"></div>
</div>

<main>
  <section class="screen active" id="screen-hoy"></section>
  <section class="screen" id="screen-sesion"></section>
  <section class="screen" id="screen-progreso"></section>
  <section class="screen" id="screen-comida"></section>
  <section class="screen" id="screen-guia"></section>
  <section class="screen" id="screen-check"></section>
</main>

<div id="resttimer"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<nav id="nav">
  <button data-screen="hoy" class="navbtn active">
    <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>HOY</button>
  <button data-screen="sesion" class="navbtn">
    <svg viewBox="0 0 24 24"><path d="M4 9.5v5M7.5 7v10M16.5 7v10M20 9.5v5M7.5 12h9"/></svg>SESIÓN</button>
  <button data-screen="progreso" class="navbtn">
    <svg viewBox="0 0 24 24"><path d="M4 4v16h16M7.5 15l3.5-4 3 2.5 4.5-5.5"/></svg>PROGRESO</button>
  <button data-screen="comida" class="navbtn">
    <svg viewBox="0 0 24 24"><path d="M4 12.5h16a8 8 0 0 1-16 0ZM3.5 20.5h17M9 8.5c0-2 3-2 3-4.5M14 8.5c0-1.5 2-1.5 2-3"/></svg>COMIDA</button>
  <button data-screen="guia" class="navbtn">
    <svg viewBox="0 0 24 24"><path d="M4 4.5h6a2.5 2.5 0 0 1 2 2v13a2 2 0 0 0-2-1.5H4zM20 4.5h-6a2.5 2.5 0 0 0-2 2v13a2 2 0 0 1 2-1.5h6z"/></svg>GUÍA</button>
  <button data-screen="check" class="navbtn">
    <svg viewBox="0 0 24 24"><path d="M10 6.5h10M10 12h10M10 17.5h10M4 6l1.4 1.4L8 4.8M4 11.5l1.4 1.4L8 10.3M4 17l1.4 1.4L8 15.8"/></svg>CHECK</button>
</nav>

<script src="js/datos.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
