<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Gym</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --bg:#0e1013;
    --card:#181b20;
    --card2:#1f232a;
    --border:#2a2f37;
    --text:#eceef1;
    --muted:#8a9099;
    --accent:#ff5a36;
    --accent2:#ffcf3f;
    --good:#3ddc84;
    --bad:#ff5a5a;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  body{padding-bottom:90px;}
  h1,h2,h3{margin:0 0 8px 0;}
  h1{font-size:1.4rem;}
  h2{font-size:1.1rem;color:var(--accent2);}
  h3{font-size:1rem;}
  p{margin:0 0 8px 0;line-height:1.4;}
  a{color:var(--accent2);}
  button{font-family:inherit;}
  #topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 8px 16px;
    border-bottom:1px solid var(--border);}
  #topbar .row{display:flex;justify-content:space-between;align-items:center;}
  #topbar .sub{color:var(--muted);font-size:.8rem;margin-top:2px;}
  main{padding:14px 16px 24px 16px;max-width:640px;margin:0 auto;}
  section.screen{display:none;}
  section.screen.active{display:block;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px;margin-bottom:12px;}
  .card.tight{padding:10px 14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--border);
    background:var(--card2);color:var(--text);font-size:1rem;font-weight:600;cursor:pointer;
    width:100%;}
  .btn:active{filter:brightness(1.15);}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1a0d08;}
  .btn-good{background:var(--good);border-color:var(--good);color:#062015;}
  .btn-ghost{background:transparent;}
  .btn-small{min-height:40px;padding:0 12px;font-size:.85rem;width:auto;}
  .btn-danger{color:var(--bad);}
  .row{display:flex;gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  .col{flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  input, select, textarea{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:1rem;min-height:44px;}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .field{margin-bottom:10px;}
  .muted{color:var(--muted);}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;background:var(--card2);
    font-size:.72rem;color:var(--muted);border:1px solid var(--border);}
  .badge.on{background:var(--accent);color:#1a0d08;border-color:var(--accent);}
  .progress{height:14px;border-radius:8px;background:var(--card2);overflow:hidden;border:1px solid var(--border);}
  .progress > div{height:100%;background:var(--accent);transition:width .2s;}
  .progress.done > div{background:var(--good);}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;}
  details{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;padding:10px 14px;}
  summary{font-weight:700;cursor:pointer;color:var(--accent2);list-style:none;}
  summary::-webkit-details-marker{display:none;}
  summary:before{content:"▸ ";}
  details[open] summary:before{content:"▾ ";}
  details .body{margin-top:10px;}
  ul{margin:4px 0;padding-left:20px;}
  li{margin-bottom:4px;}
  #nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);
    border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
  #nav button{flex:1;background:none;border:none;color:var(--muted);padding:8px 2px 6px 2px;
    font-size:.68rem;min-height:56px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;}
  #nav button .ic{font-size:1.2rem;}
  #nav button.active{color:var(--accent2);}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;
    align-items:flex-end;justify-content:center;}
  .overlay.center{align-items:center;padding:16px;}
  .sheet{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 0 0;
    padding:18px;width:100%;max-width:640px;max-height:82vh;overflow:auto;}
  .overlay.center .sheet{border-radius:16px;max-height:80vh;}
  .toast{position:fixed;left:16px;right:16px;bottom:80px;background:var(--card2);
    border:1px solid var(--accent);border-radius:12px;padding:12px 14px;z-index:200;
    font-size:.9rem;}
  .exset{display:grid;grid-template-columns:44px 1fr 1fr 48px;gap:6px;align-items:center;margin-bottom:6px;}
  .exset .lbl{color:var(--muted);font-size:.8rem;}
  .exset .chk{min-height:44px;border-radius:10px;border:1px solid var(--border);
    background:var(--card2);color:var(--muted);font-size:1.1rem;}
  .exset .chk.on{background:var(--good);color:#062015;border-color:var(--good);}
  .exname{font-size:1.05rem;font-weight:700;}
  .extarget{color:var(--accent2);font-size:.85rem;margin-bottom:2px;}
  .exlast{color:var(--muted);font-size:.78rem;margin-bottom:8px;}
  .exdone{opacity:.55;}
  #resttimer{position:fixed;left:0;right:0;bottom:70px;background:var(--accent);color:#1a0d08;
    padding:10px 16px;display:none;z-index:40;font-weight:700;text-align:center;}
  #resttimer.show{display:block;}
  .switch2{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .switch2 button{flex:1;background:var(--card2);color:var(--muted);border:none;padding:10px;font-weight:700;min-height:44px;}
  .switch2 button.active{background:var(--accent);color:#1a0d08;}
  .rescate{position:fixed;right:14px;bottom:80px;z-index:15;background:var(--card2);
    border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:8px 12px;font-size:.75rem;}
  .foodbtn{background:var(--card2);border:1px solid var(--border);border-radius:12px;
    padding:10px;text-align:center;min-height:56px;}
  .foodbtn b{display:block;font-size:.85rem;}
  .foodbtn span{color:var(--muted);font-size:.72rem;}
  .item-x{color:var(--bad);background:none;border:none;font-size:1rem;padding:4px 8px;}
  hr{border:none;border-top:1px solid var(--border);margin:10px 0;}
  .frase{font-style:italic;color:var(--accent2);}
  .destacado{color:var(--accent2);font-weight:700;}
  .kpi{display:flex;justify-content:space-between;align-items:baseline;}
  .kpi b{font-size:1.4rem;}
  .chart{width:100%;height:140px;}
</style>
</head>
<body>

<div id="topbar">
  <div class="row">
    <h1 id="topTitle">MI GYM</h1>
    <span class="badge" id="topDay"></span>
  </div>
  <div class="sub" id="topSub"></div>
</div>

</nav>

/* ============================= ESTADO ============================= */

const STORAGE_KEY = "gymapp_v1";
function defaultState(){
  return {
    modo:"normal",
    pesoLog:[],
    historial:{},
    sesionActual:null,
    proteina:{fecha:null, gramos:0, kcal:0, items:[]},
    checklist:{fecha:null, marcados:{}},
    medidas:[],
    fotos:{ultimaFecha:null},
    subirPeso:{}
  };
}
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ============================= HELPERS ============================= */

const DIAS_ORDEN = ["lunes","martes","miercoles","jueves","viernes","sabado","domingo"];
const DIAS_LABEL = {lunes:"LUNES",martes:"MARTES",miercoles:"MIÉRCOLES",jueves:"JUEVES",viernes:"VIERNES",sabado:"SÁBADO",domingo:"DOMINGO"};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function getDiaKey(date){
  const jsDay = date.getDay(); // 0=domingo
  return ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"][jsDay];
}
function fmtFecha(iso){
  const [y,m,d] = iso.split("-");
  return d+"/"+m+"/"+y;
}
function daysBetween(a,b){
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function getRutina(modo){ return modo==="obra" ? RUTINA_OBRA : RUTINA_NORMAL; }
function getRutinaDia(modo, diaKey){ return getRutina(modo).dias[diaKey]; }
function nombreEjercicio(id){
  for(const modo of [RUTINA_NORMAL, RUTINA_OBRA]){
    for(const dk of DIAS_ORDEN){
      const dia = modo.dias[dk];
      if(!dia || !dia.ejercicios) continue;
      const ex = dia.ejercicios.find(e=>e.id===id);
      if(ex) return ex.nombre;
    }
  }
  return id;
}
function parseRepRange(str){
  const nums = (str.match(/\d+(\.\d+)?/g)||[]).map(Number);
  if(nums.length===0) return {low:0, high:0};
  if(nums.length===1) return {low:nums[0], high:nums[0]};
  return {low:nums[0], high:nums[1]};
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg, ms){
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, ms||2600);
}
function randFrase(){
  return FRASES[Math.floor(Math.random()*FRASES.length)];
}

/* ============================= SESIÓN ============================= */

function iniciarSesion(diaKey, modoRapido){
  const dia = getRutinaDia(state.modo, diaKey);
  state.sesionActual = {
    fecha: todayStr(),
    diaKey, nombre: dia.nombre, modo: state.modo,
    modoRapido: !!modoRapido,
    ejercicios: dia.ejercicios.map(ex=>({
      id:ex.id, nombre:ex.nombre, series:ex.series, repes:ex.repes,
      descanso_seg:ex.descanso_seg||90, tipo:ex.tipo,
      sets: Array.from({length:ex.series}, ()=>({peso:"",repes:"",done:false}))
    }))
  };
  saveState();
  switchScreen("sesion");
}

function ultimaVez(exId){
  const h = state.historial[exId];
  if(!h || !h.length) return null;
  return h[h.length-1];
}

function renderEjercicio(ex, idx){
  const uv = ultimaVez(ex.id);
  const uvTxt = uv ? uv.series.map(st=>`${st.peso}kg×${st.repes}`).join(", ") : "Sin registros previos";
  const listo = state.subirPeso[ex.id];
  const completo = ex.sets.every(st=>st.done);
  return `
  <div class="card ${completo?'exdone':''}">
    <div class="row" style="justify-content:space-between;align-items:flex-start;">
      <div>
        <div class="exname">${escapeHtml(ex.nombre)} ${listo?'<span class="badge on">Sube peso</span>':''}</div>
        <div class="extarget">${ex.series} x ${escapeHtml(ex.repes)} · descanso ${Math.round(ex.descanso_seg/60*10)/10>=1? Math.floor(ex.descanso_seg/60)+"m":ex.descanso_seg+"s"}</div>
        <div class="exlast">Última vez: ${escapeHtml(uvTxt)}</div>
      </div>
      <button class="btn btn-small btn-ghost btn-tecnica" data-ex="${ex.id}">técnica</button>
    </div>
    ${ex.sets.map((st,si)=>`
      <div class="exset">
        <div class="lbl">#${si+1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" value="${st.peso}" data-peso data-ex="${idx}" data-set="${si}">
        <input type="number" inputmode="numeric" placeholder="repes" value="${st.repes}" data-repes data-ex="${idx}" data-set="${si}">
        <button class="chk ${st.done?'on':''}" data-ex="${idx}" data-set="${si}">${st.done?'✓':'—'}</button>
      </div>
    `).join("")}
  </div>`;
}

function currentEjercicios(){
  const s = state.sesionActual;
  return s.modoRapido ? s.ejercicios.slice(0,3) : s.ejercicios;
}

function onSetInput(e){
  const s = state.sesionActual;
  const lista = currentEjercicios();
  const exIdx = Number(e.target.dataset.ex);
  const setIdx = Number(e.target.dataset.set);
  const ex = lista[exIdx];
  const st = ex.sets[setIdx];
  if(e.target.hasAttribute("data-peso")) st.peso = e.target.value;
  else st.repes = e.target.value;
  saveState();
}

function onSetCheck(e){
  const lista = currentEjercicios();
  const exIdx = Number(e.target.dataset.ex);
  const setIdx = Number(e.target.dataset.set);
  const ex = lista[exIdx];
  const st = ex.sets[setIdx];
  st.done = !st.done;
  saveState();
  if(st.done){
    startRestTimer(ex.descanso_seg);
  }
  RENDERERS.sesion();
}

let restInterval = null;
function startRestTimer(seconds){
  clearInterval(restInterval);
  let remaining = seconds;
  const box = document.getElementById("resttimer");
  box.classList.add("show");
  function tick(){
    const m = Math.floor(remaining/60), sec = remaining%60;
    box.innerHTML = `Descanso: ${m}:${String(sec).padStart(2,"0")} <span style="text-decoration:underline;margin-left:10px;" id="skipRest">saltar</span>`;
    const skip = document.getElementById("skipRest");
    if(skip) skip.onclick = ()=>{ clearInterval(restInterval); box.classList.remove("show"); };
    if(remaining<=0){
      clearInterval(restInterval);
      box.classList.remove("show");
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    remaining--;
  }
  tick();
  restInterval = setInterval(tick, 1000);
}

function showTecnica(exId){
  const t = TECNICA[exId];
  const nombre = nombreEjercicio(exId);
  let body;
  if(!t){
    body = `<p class="muted">Sin notas específicas guardadas para este ejercicio. Técnica estándar, controlada y sin prisa.</p>`;
  }else{

  }
  showModal(`<h2>${escapeHtml(nombre)}</h2>${body}<button class="btn btn-primary" id="mCerrar" style="margin-top:10px;">Cerrar</button>`);
  document.getElementById("mCerrar").addEventListener("click", closeModal);

function terminarSesion(){
  const s = state.sesionActual;
  const subenPeso = [];
  s.ejercicios.forEach(ex=>{
    const setsGuardables = ex.sets.filter(st=>st.done && st.peso!=="" && st.repes!=="");
    if(setsGuardables.length===0) return;
    if(!state.historial[ex.id]) state.historial[ex.id] = [];
    state.historial[ex.id].push({
      fecha: s.fecha,
      series: setsGuardables.map(st=>({peso:Number(st.peso), repes:Number(st.repes)}))
    });
    const {high} = parseRepRange(ex.repes);
    const todasAlTope = setsGuardables.length>=ex.series && setsGuardables.every(st=>Number(st.repes)>=high);
    if(todasAlTope){
      state.subirPeso[ex.id] = true;
      subenPeso.push(ex.nombre);
    } else {
      state.subirPeso[ex.id] = false;
    }
  });
  state.sesionActual = null;
  saveState();
  switchScreen("hoy");
  if(subenPeso.length){
    toast("Sesión guardada. Sube el peso en: "+subenPeso.join(", "), 4500);
  }else{
    toast("Sesión guardada. Buen trabajo.");
  }
}

function svgLineChart(points, opts){
  opts = opts || {};
  if(!points.length) return `<p class="muted">Sin datos todavía.</p>`;
  const w = 300, h = 120, pad = 20;
  const values = points.map(p=>p.v);
  let min = Math.min(...values), max = Math.max(...values);
  if(min===max){ min-=1; max+=1; }
  const stepX = points.length>1 ? (w-2*pad)/(points.length-1) : 0;
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.v-min)/(max-min))*(h-2*pad);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="#ff5a36"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${path}" fill="none" stroke="#ff5a36" stroke-width="2"/>
    ${dots}
  </svg>
  <div class="row" style="justify-content:space-between;font-size:.72rem;" class="muted">
    <span class="muted">${fmtFecha(points[0].fecha)}</span>
    <span class="muted">${fmtFecha(points[points.length-1].fecha)}</span>
  </div>`;
}

function renderPesoChart(){
  const pts = state.pesoLog.map(p=>({v:p.kg, fecha:p.fecha}));
  return svgLineChart(pts);
}
function renderEjercicioChart(exId){
  const h = state.historial[exId]||[];
  const pts = h.map(ses=>({v: Math.max(...ses.series.map(s=>s.peso)), fecha: ses.fecha}));
  return svgLineChart(pts);
}

function copyToClipboard(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Copiado. Pégalo en WhatsApp.")).catch(fallbackCopy);
  } else fallbackCopy();

    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copiado. Pégalo en WhatsApp."); }catch(e){ toast("No se pudo copiar."); }
    ta.remove();
  }
}

  const hoy = todayStr();
  if(state.checklist.fecha !== hoy){
    state.checklist = {fecha:hoy, marcados:{}};
    saveState();
  }
  const todosMarcados = CHECKLIST_ITEMS.every(it=>state.checklist.marcados[it.id]);
  el.innerHTML = `
    <div class="card">
      <h2>Checklist noche anterior</h2>
      <p class="muted" style="font-size:.82rem;">Marca esto antes de acostarte (domingo, lunes y miércoles, antes de un día de gym).</p>
      ${CHECKLIST_ITEMS.map(it=>`
        <button class="btn ${state.checklist.marcados[it.id]?'btn-good':''}" data-item="${it.id}" style="justify-content:flex-start;margin-bottom:8px;">
          ${state.checklist.marcados[it.id]?'✓':'○'}&nbsp;&nbsp;${escapeHtml(it.txt)}
        </button>
      `).join("")}
      ${todosMarcados? `<p class="frase" style="margin-top:6px;">Todo listo. Ahora a dormir.</p>` : ""}
    </div>
  `;
  el.querySelectorAll("[data-item]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.dataset.item;
      state.checklist.marcados[id] = !state.checklist.marcados[id];
      saveState();
      RENDERERS.check();
    });
  });
};

/* ============================= INIT ============================= */

RENDERERS.hoy();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
