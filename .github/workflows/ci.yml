name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una rama con PR abierta se probaba dos veces, una por el push y otra por la
# PR. Con esto se prueba una vez, y un push nuevo cancela la tanda anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint js tests sw.js eslint.config.js

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests
        run: npm test
