name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publicar es copiar la web a la rama gh-pages, que es de donde sirve Pages.
# (El camino "oficial" con configure-pages/deploy-pages no vale aquí: crear el
#  sitio de Pages pide permisos de administración que el token de Actions no
#  tiene, así que fallaba en cada push.)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo lo que la web necesita: ni pruebas, ni herramientas, ni workflows.
      - name: Preparar lo que se publica
        run: |
          mkdir sitio
          cp -R index.html manifest.json sw.js icon.svg icon-*.png css js sitio/
          touch sitio/.nojekyll

      - name: Copiarlo a la rama gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd sitio
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar $GITHUB_SHA"
          git push -q --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages
